<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #display {
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    color: #fff;
    user-select: none;
    letter-spacing: -0.02em;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #hole-text {
    font-size: min(42vw, 55vh);
    line-height: 1;
  }

  #controls {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    z-index: 10;
  }

  #gps-btn, #fs-btn {
    padding: 5px 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #444;
    border-radius: 100px;
    color: #666;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    cursor: pointer;
    -webkit-appearance: none;
    transition: all 0.2s;
    white-space: nowrap;
  }
  #gps-btn.searching { border-color: #ff9800; color: #ff9800; }
  #gps-btn.on        { border-color: #4caf50; color: #4caf50; }
  #gps-btn.manual    { border-color: #2196f3; color: #2196f3; }
  #gps-btn.error     { border-color: #f44336; color: #f44336; }

  #hole-text { cursor: pointer; }

  /* 前後ボタン */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 72px;
    padding: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid #333;
    color: #777;
    font-size: 18px;
    cursor: pointer;
    -webkit-appearance: none;
    z-index: 5;
  }
  #prev-btn { left: 0; border-radius: 0 12px 12px 0; border-left: none; }
  #next-btn { right: 0; border-radius: 12px 0 0 12px; border-right: none; }
  .nav-btn:active { background: rgba(255,255,255,0.18); color: #ccc; }

  /* 縦向き：ホール番号の下に左右ボタンを並べる */
  @media (orientation: portrait) {
    .nav-btn {
      top: calc(50% + min(21vw, 27.5vh) + 20px);
      transform: none;
      width: 84px; height: 48px;
      border: 1px solid #333;
      border-radius: 12px;
    }
    #prev-btn { left: calc(50% - 92px); right: auto; }
    #next-btn { left: calc(50% + 8px);  right: auto; }
  }

  /* ホール選択 */
  #picker {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 20;
    align-items: center;
    justify-content: center;
  }
  #picker.show { display: flex; }
  #picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    width: min(94vw, 640px);
  }
  #picker-grid button {
    padding: 0;
    height: min(14vw, 64px);
    background: rgba(255,255,255,0.05);
    border: 1px solid #444;
    border-radius: 10px;
    color: #ddd;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: max(16px, min(5vw, 24px));
    cursor: pointer;
    -webkit-appearance: none;
  }
  #picker-grid button.cur { border-color: #fff; background: rgba(255,255,255,0.22); color: #fff; }
  #picker-grid button:active { background: rgba(255,255,255,0.3); }

  #gps-row { display: flex; align-items: center; gap: 6px; }

  #info-btn {
    width: 22px; height: 22px;
    padding: 0;
    background: rgba(0,0,0,0.6);
    border: 1px solid #444;
    border-radius: 50%;
    color: #666;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    -webkit-appearance: none;
  }
  #info-btn.open { border-color: #aaa; color: #ccc; }

  #legend {
    display: none;
    background: rgba(20,20,20,0.95);
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 400;
    font-size: 11px;
    line-height: 1.5;
    color: #bbb;
    max-width: 260px;
  }
  #legend.show { display: block; }
  #legend .row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  #legend .row:last-child { margin-bottom: 0; }
  #legend .dot {
    flex: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div id="display">
  <div id="hole-text">1H</div>
</div>
<button id="prev-btn" class="nav-btn" aria-label="前のホール">◀</button>
<button id="next-btn" class="nav-btn" aria-label="次のホール">▶</button>
<div id="picker"><div id="picker-grid"></div></div>
<div id="controls">
  <button id="fs-btn">⛶ 全画面</button>
  <div id="gps-row">
    <button id="gps-btn">📍 自動判定</button>
    <button id="info-btn" aria-label="凡例">i</button>
  </div>
  <div id="legend">
    <div class="row"><span class="dot" style="background:#666"></span><span>グレー：自動判定オフ</span></div>
    <div class="row"><span class="dot" style="background:#ff9800"></span><span>オレンジ：測位中、またはコース外（ホールは変わりません）</span></div>
    <div class="row"><span class="dot" style="background:#4caf50"></span><span>緑：自動判定中（表示中のホールが現在地の近く）</span></div>
    <div class="row"><span class="dot" style="background:#2196f3"></span><span>青：手動で変更中（表示中のホールが現在地から100m以上離れています。次のホールのティー付近でのみ自動で進みます）</span></div>
    <div class="row"><span class="dot" style="background:#f44336"></span><span>赤：位置情報を取得できません</span></div>
  </div>
</div>

<script>
  const holes = [
    { label: '1H',  tee: [35.11827404319132,  136.5848836977423 ],  green: [35.12157168411027,  136.584634640518   ] },
    { label: '2H',  tee: [35.12159160535401,  136.58530285771215],  green: [35.11821060947743,  136.58607766896907 ] },
    { label: '3H',  tee: [35.11768599183355,  136.58660738919752],  green: [35.117565583192125, 136.59135625625302 ] },
    { label: '4H',  tee: [35.11803702665007,  136.59146218741182],  green: [35.11769283367596,  136.5897362020423  ] },
    { label: '5H',  tee: [35.11847143014149,  136.58993869272356],  green: [35.11914523028993,  136.5870539930841  ] },
    { label: '6H',  tee: [35.11928976983819,  136.58810942620858],  green: [35.121440051943516, 136.58589527879062 ] },
    { label: '7H',  tee: [35.12178203525314,  136.5863391682892 ],  green: [35.121856886410576, 136.5880785968826  ] },
    { label: '8H',  tee: [35.12236998815229,  136.5879484936641 ],  green: [35.12313370296017,  136.58454344543392 ] },
    { label: '9H',  tee: [35.12237986048209,  136.5840887948945 ],  green: [35.11852653885937,  136.5839801815553  ] },
    { label: '10H', tee: [35.11763662743282,  136.58225416394296],  green: [35.11469562153404,  136.58160201505123 ] },
    { label: '11H', tee: [35.11462205185275,  136.58011376116536],  green: [35.11953117054232,  136.58017507984533 ] },
    { label: '12H', tee: [35.11953219865275,  136.57940029353114],  green: [35.118636045188055, 136.5780614991863  ] },
    { label: '13H', tee: [35.11859319435323,  136.57958268374855],  green: [35.11595499815173,  136.5781580587088  ] },
    { label: '14H', tee: [35.11551612427346,  136.57741143559977],  green: [35.113853100876504, 136.580706157216   ] },
    { label: '15H', tee: [35.114605596420866, 136.5806716606501 ],  green: [35.11769264261017,  136.58133379411223 ] },
    { label: '16H', tee: [35.117984371530206, 136.58206104491055],  green: [35.11933810515115,  136.58155909966953 ] },
    { label: '17H', tee: [35.11987554682548,  136.580880872972  ],  green: [35.122510463068416, 136.58273390721695 ] },
    { label: '18H', tee: [35.12253013877171,  136.58356308195286],  green: [35.118526347842305, 136.58309868765394 ] },
  ];

  let idx = 0;
  let watchId = null;
  let minGreenDist = Infinity;
  let approachedGreen = false;

  const holeText = document.getElementById('hole-text');
  const gpsBtn   = document.getElementById('gps-btn');
  const display  = document.getElementById('display');

  function show() { holeText.textContent = holes[idx].label; }

  function next() { idx = (idx + 1) % holes.length; candCount = 0; show(); refreshBtn(); }
  function prev() { idx = (idx - 1 + holes.length) % holes.length; candCount = 0; show(); refreshBtn(); }

  // スワイプ
  let startX = 0, startY = 0;
  display.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  display.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      dx < 0 ? next() : prev();
    }
  }, { passive: true });

  // キーボード
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft')  prev();
  });

  // 距離計算（メートル）
  function dist(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function holeDist(lat, lng, h) {
    return Math.min(dist(lat, lng, h.tee[0], h.tee[1]), dist(lat, lng, h.green[0], h.green[1]));
  }

  function nearestHole(lat, lng) {
    let minD = Infinity, best = 0;
    holes.forEach((h, i) => {
      const d = holeDist(lat, lng, h);
      if (d < minD) { minD = d; best = i; }
    });
    return { index: best, d: minD };
  }

  const COURSE_RADIUS = 300; // コースから300m以内なら「コース内」とみなす
  let locked = false;        // 最初のホール判定が済んだか
  const NEXT_TEE_RADIUS = 40; // 次ホールのティーからこの距離(m)以内で次ホールへ
  const SWITCH_COUNT    = 2;  // 切替に必要な連続判定回数
  let candCount = 0;
  const MANUAL_FAR = 100;    // 表示ホールが現在地からこの距離(m)以上離れていたら「手動」(青)
  let lastPos = null;        // 最新の現在地 [lat, lng]
  let gpsError = false;

  // ボタンの色を状態から決める
  function refreshBtn() {
    let cls = '';
    if (watchId !== null) {
      if (gpsError) cls = 'error';
      else if (!lastPos) cls = 'searching';
      else if (nearestHole(lastPos[0], lastPos[1]).d > COURSE_RADIUS) cls = 'searching';
      else if (holeDist(lastPos[0], lastPos[1], holes[idx]) > MANUAL_FAR) cls = 'manual';
      else cls = 'on';
    }
    gpsBtn.className = cls;
  }

  function startGPS() {
    if (!navigator.geolocation) { gpsBtn.className = 'error'; return; }
    gpsError = false;
    lastPos = null;
    watchId = -1; // 開始直後（測位中）
    refreshBtn();

    watchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        lastPos = [lat, lng];
        gpsError = false;
        const near = nearestHole(lat, lng);

        // コース外：ホールは変更せず、オレンジ表示のまま待機
        if (near.d > COURSE_RADIUS) {
          refreshBtn();
          return;
        }

        // 自動モードの動き：
        //  ・最初の1回だけ、一番近いホールに合わせる
        //  ・以降は「次のホールのティー」に近づいたときだけ次のホールへ進む
        //  ・大きく離れたホールへの移動は手動（スワイプ）で切り替える
        if (!locked) {
          idx = near.index;
          locked = true;
          candCount = 0;
        } else {
          const next = (idx + 1) % holes.length;
          const dNextTee = dist(lat, lng, holes[next].tee[0], holes[next].tee[1]);
          if (dNextTee < NEXT_TEE_RADIUS) {
            candCount++;
            if (candCount >= SWITCH_COUNT) {
              idx = next;
              candCount = 0;
            }
          } else {
            candCount = 0;
          }
        }

        show();
        refreshBtn();
      },
      () => { gpsError = true; refreshBtn(); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  }

  function stopGPS() {
    if (watchId !== null && watchId !== -1) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    locked = false;
    lastPos = null;
    refreshBtn();
  }

  // 前後ボタン
  document.getElementById('prev-btn').addEventListener('click', e => { e.stopPropagation(); prev(); });
  document.getElementById('next-btn').addEventListener('click', e => { e.stopPropagation(); next(); });

  // ホール選択（ホール番号をタップ）
  const picker     = document.getElementById('picker');
  const pickerGrid = document.getElementById('picker-grid');
  const pickerBtns = holes.map((h, i) => {
    const b = document.createElement('button');
    b.textContent = h.label;
    b.addEventListener('click', e => {
      e.stopPropagation();
      idx = i; candCount = 0;
      show(); refreshBtn();
      picker.classList.remove('show');
    });
    pickerGrid.appendChild(b);
    return b;
  });
  holeText.addEventListener('click', e => {
    e.stopPropagation();
    pickerBtns.forEach((b, i) => b.classList.toggle('cur', i === idx));
    picker.classList.add('show');
  });
  picker.addEventListener('click', () => picker.classList.remove('show'));

  // 凡例（iボタン）
  const infoBtn = document.getElementById('info-btn');
  const legend  = document.getElementById('legend');
  infoBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = legend.classList.toggle('show');
    infoBtn.classList.toggle('open', open);
  });
  document.addEventListener('click', () => {
    legend.classList.remove('show');
    infoBtn.classList.remove('open');
  });

  gpsBtn.addEventListener('click', e => {
    e.stopPropagation();
    watchId === null ? startGPS() : stopGPS();
  });

  // 全画面
  const fsBtn = document.getElementById('fs-btn');
  function updateFsBtn() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsBtn.textContent = isFs ? '✕ 全画面解除' : '⛶ 全画面';
  }
  fsBtn.addEventListener('click', e => {
    e.stopPropagation();
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', updateFsBtn);
  document.addEventListener('webkitfullscreenchange', updateFsBtn);

  show();
</script>
</body>
</html>
